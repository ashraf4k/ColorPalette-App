<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Color Palette Generator</h1>

        <button id="generate-btn">
            <i class="fas fa-sync-alt"></i>
            Generate Palette
        </button>

        <div class="palette-container">
            <div class="color-box">
                <div class="color" style="background-color: #e1f5fe;"></div>
                <div class="color-info">
                    <span class="hex-value">#E1F5FE</span>
                    <i class="far fa-copy copy-btn" title="Copy to clipbord"></i>
                </div>
            </div>

            <div class="color-box">
                <div class="color" style="background-color: #fef3ac;"></div>
                <div class="color-info">
                    <span class="hex-value">#FEF3AC</span>
                    <i class="far fa-copy copy-btn" title="Copy to clipbord"></i>
                </div>
            </div>

            <div class="color-box">
                <div class="color" style="background-color: #a9d9ce;"></div>
                <div class="color-info">
                    <span class="hex-value">#A9D9CE</span>
                    <i class="far fa-copy copy-btn" title="Copy to clipbord"></i>
                </div>
            </div>

            <div class="color-box">
                <div class="color" style="background-color: #b3b3b3;"></div>
                <div class="color-info">
                    <span class="hex-value">#B3B3B3</span>
                    <i class="far fa-copy copy-btn" title="Copy to clipbord"></i>
                </div>
            </div>

            <div class="color-box">
                <div class="color" style="background-color: #c7cc7c;"></div>
                <div class="color-info">
                    <span class="hex-value">#C7CC7C</span>
                    <i class="far fa-copy copy-btn" title="Copy to clipbord"></i>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="test.js"></script>
</body>
</html>
